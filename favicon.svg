<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
    </defs>
    <!-- Premium rounded square background -->
    <rect width="32" height="32" rx="9" fill="url(#logo-gradient)" />
    <!-- Sleek, abstract document lines representing an invoice -->
    <rect x="8" y="8" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
    <rect x="8" y="14" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
    <rect x="8" y="20" width="10" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
    <!-- Dynamic dot indicating success/completeness -->
    <circle cx="21.5" cy="21.5" r="2.5" fill="#60a5fa" />
</svg>
